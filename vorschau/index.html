<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef2ef" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1513" media="(prefers-color-scheme: dark)">
<meta name="description" content="Flugfenster an Schwarzwald-Startplätzen, bewertet nach deinem Pilotenprofil.">
<title>Flugwetter Vorschau</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FW Vorschau">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
/* Layout: eine Spalte wie ein Flugbuch. Oben Kopfzeile mit Datenstand und Reitern, darunter Tageswahl
   und Startplatz-Karten mit Stundenleiste. Farben: Nebelgrau mit Waldstich, Seeblau für Bedienung,
   je eine Farbe pro persönlicher Zone (Komfort grün, Progress gelb, Challenge orange, Überforderung rot
   und zusätzlich schraffiert, No-Go grau). */
:root {
  --bg: #eef2ef;
  --surface: #ffffff;
  --surface-2: #f5f8f6;
  --fg: #16211c;
  --muted: #5a6962;
  --line: #d4ddd8;
  --accent: #1c6782;
  --accent-ink: #ffffff;
  --accent-soft: #dcebf1;
  --danger: #a63c28;
  --warn: #8a5d00;
  --ok-soft: #dcefe5;
  --z-green: #2a7f60;
  --z-green-ink: #ffffff;
  --z-yellow: #e9c341;
  --z-yellow-ink: #2b2200;
  --z-orange: #e27a2c;
  --z-orange-ink: #2a1200;
  --z-red: #b8392a;
  --z-red-ink: #ffffff;
  --z-nogo: #cfd6d2;
  --z-nogo-ink: #3a4640;
  --z-yellow-strong: #a87e00;
  --z-orange-strong: #c25a14;
  --bar-track: #e3e9e5;
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1513;
    --surface: #17201c;
    --surface-2: #1c2722;
    --fg: #e3eae6;
    --muted: #97a79f;
    --line: #2b3832;
    --accent: #66b8d6;
    --accent-ink: #08171d;
    --accent-soft: #173442;
    --danger: #f08268;
    --warn: #e6b450;
    --ok-soft: #173328;
    --z-green: #43b58b;
    --z-green-ink: #04190f;
    --z-yellow: #e6c95a;
    --z-yellow-ink: #231c00;
    --z-orange: #f0904a;
    --z-orange-ink: #2a1200;
    --z-red: #ef6f5c;
    --z-red-ink: #2b0904;
    --z-nogo: #38443e;
    --z-nogo-ink: #c3cec8;
    --z-yellow-strong: var(--z-yellow);
    --z-orange-strong: var(--z-orange);
    --bar-track: #26312c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1513;
  --surface: #17201c;
  --surface-2: #1c2722;
  --fg: #e3eae6;
  --muted: #97a79f;
  --line: #2b3832;
  --accent: #66b8d6;
  --accent-ink: #08171d;
  --accent-soft: #173442;
  --danger: #f08268;
  --warn: #e6b450;
  --ok-soft: #173328;
  --z-green: #43b58b;
  --z-green-ink: #04190f;
  --z-yellow: #e6c95a;
  --z-yellow-ink: #231c00;
  --z-orange: #f0904a;
  --z-orange-ink: #2a1200;
  --z-red: #ef6f5c;
  --z-red-ink: #2b0904;
  --z-nogo: #38443e;
  --z-nogo-ink: #c3cec8;
  --z-yellow-strong: var(--z-yellow);
  --z-orange-strong: var(--z-orange);
  --bar-track: #26312c;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  z-index: 10;
  background: var(--surface);
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.wrap {
  max-width: 680px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* Kopfzeile */
.top {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 5;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}
.top .wrap { padding-block: 10px 0; display: grid; gap: 6px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.45rem;
  letter-spacing: 0.01em;
  line-height: 1.1;
}
.badge {
  justify-self: start;
  margin: 0;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--z-yellow);
  color: var(--z-yellow-ink);
  font-family: var(--font-body);
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.status { font-size: 0.82rem; color: var(--muted); min-height: 1.2em; }
.status strong { color: var(--fg); font-weight: 600; }
.status.warn strong { color: var(--warn); }
[hidden] { display: none !important; }
.refresh {
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 0.85rem;
  white-space: nowrap;
}
.tabs { display: flex; gap: 4px; margin-top: 2px; }
.tabs a {
  flex: 1;
  text-align: center;
  padding: 8px 4px 9px;
  text-decoration: none;
  color: var(--muted);
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 1rem;
  letter-spacing: 0.02em;
  border-bottom: 3px solid transparent;
}
.tabs a[aria-current="page"] { color: var(--fg); border-bottom-color: var(--accent); }

main .wrap { padding-block: 14px 48px; display: grid; gap: 16px; }

/* Tageswahl */
.days {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.days::-webkit-scrollbar { display: none; }
.day {
  flex: 0 0 auto;
  min-width: 78px;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--radius);
  padding: 7px 10px 8px;
  text-align: left;
  display: grid;
  gap: 1px;
}
.day .d1 { font-family: var(--font-display); font-weight: 600; font-size: 1.02rem; }
.day .d2 { font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.day[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.day .dots { display: flex; gap: 3px; margin-top: 4px; height: 6px; }
.day .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--zc, var(--z-nogo)); }

.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chip {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 0.88rem;
}
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.dayhead { display: grid; gap: 2px; }
.dayhead h2 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.25rem;
  text-wrap: balance;
}
.dayhead p { margin: 0; color: var(--muted); font-size: 0.88rem; }

.group { display: grid; gap: 10px; }
.group > h3 {
  margin: 4px 0 0;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-weight: 600;
}

/* Startplatz-Karte */
.card {
  display: grid;
  gap: 8px;
  width: 100%;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px 12px;
}
.card:hover { border-color: var(--accent); }
.card .row1 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card .name { font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; line-height: 1.15; }
.card .meta { font-size: 0.82rem; color: var(--muted); }
.fit {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.2rem;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.fit small { font-family: var(--font-body); font-weight: 500; font-size: 0.72rem; color: var(--muted); margin-left: 2px; }
.wins { display: flex; flex-wrap: wrap; gap: 6px; }

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 6px;
  padding: 2px 8px;
  font-size: 0.85rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
  background: var(--zc, var(--surface-2));
  color: var(--zi, var(--fg));
}

/* Persönliche Zonen: die Klasse setzt nur Farben, Pille, Balken und Skala holen sie sich ab. */
.p-green { --zc: var(--z-green); --zi: var(--z-green-ink); }
.p-yellow { --zc: var(--z-yellow); --zi: var(--z-yellow-ink); }
.p-orange { --zc: var(--z-orange); --zi: var(--z-orange-ink); }
.p-red {
  --zc: var(--z-red);
  --zi: var(--z-red-ink);
  --zpat: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.34) 0 2px, transparent 2px 6px);
}
.p-no-go { --zc: var(--z-nogo); --zi: var(--z-nogo-ink); }

/* Stundenleiste */
.strip { display: grid; gap: 3px; }
.strip .bars { display: flex; gap: 2px; height: 14px; }
.strip .bars span { flex: 1; border-radius: 2px; background-color: var(--zc, var(--z-nogo)); background-image: var(--zpat, none); }
.strip .bars span.weak { opacity: 0.4; }
.strip .bars span.past { opacity: 0.25; }
.strip .ticks { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.nogo-list { display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.nogo-list button {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  text-align: left;
  background: none;
  border: 0;
  border-top: 1px solid var(--line);
  padding: 10px 14px;
}
.nogo-list button:first-child { border-top: 0; }
.nogo-list .n { font-weight: 600; }
.nogo-list .r { color: var(--muted); font-size: 0.85rem; text-align: right; }

.empty {
  background: var(--surface);
  border: 1px dashed var(--line);
  border-radius: var(--radius);
  padding: 14px;
  color: var(--muted);
}

/* Detailansicht */
.back { justify-self: start; background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; }
.spothead h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.6rem; line-height: 1.1; text-wrap: balance; }
.spothead p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
.facts {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 8px 16px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px;
  margin: 0;
}
.facts div { min-width: 0; }
.facts dt { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.facts dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; }
.verdict { margin: 0; font-weight: 600; }
.sun { margin: 2px 0 0; color: var(--muted); font-size: 0.85rem; font-variant-numeric: tabular-nums; }

.hours { display: grid; gap: 8px; }
.hour {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 10px 12px;
  display: grid;
  gap: 8px;
}
.hour.past { opacity: 0.55; }
.hour .h1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hour time { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; font-variant-numeric: tabular-nums; min-width: 3.1em; }
.hour .air { font-size: 0.82rem; color: var(--muted); }
.hour .fitline { margin-left: auto; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.hour .fitline b { color: var(--fg); font-size: 1rem; }
.dims { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.dim { display: grid; gap: 3px; min-width: 0; }
.dim .dl { display: flex; justify-content: space-between; gap: 4px; font-size: 0.74rem; color: var(--muted); }
.dim .dl b { color: var(--fg); font-family: var(--font-display); font-size: 0.95rem; }
.bar { position: relative; height: 6px; border-radius: 3px; background: var(--bar-track); }
.bar > span {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: 3px;
  background-color: var(--zc, var(--accent));
  background-image: var(--zpat, none);
}
.bar > i { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--fg); opacity: 0.55; border-radius: 1px; }
.keydata { margin: 0; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.notes { margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 0.88rem; }
.notes li { padding-left: 1.1em; position: relative; }
.notes li::before { position: absolute; left: 0; top: 0; }
.notes li.nogo { color: var(--danger); }
.notes li.nogo::before { content: "✕"; }
.notes li.warn { color: var(--warn); }
.notes li.warn::before { content: "!"; font-weight: 700; left: 0.25em; }
.notes li.info { color: var(--muted); }
.notes li.info::before { content: "·"; font-weight: 700; left: 0.3em; }
details.why summary { font-size: 0.85rem; color: var(--accent); cursor: pointer; }
details.why ul { margin: 6px 0 0; padding-left: 1.1em; font-size: 0.85rem; color: var(--muted); display: grid; gap: 2px; }

.box {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: grid;
  gap: 8px;
}
.box h3 { margin: 0; font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; }
.box p, .box ul { margin: 0; }
.box ul { padding-left: 1.1em; display: grid; gap: 4px; }
.small { font-size: 0.82rem; color: var(--muted); }

/* Profil */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.seg button {
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--radius);
  padding: 8px 6px;
  display: grid;
  gap: 2px;
  text-align: center;
}
.seg button b { font-family: var(--font-display); font-size: 1.05rem; }
.seg button span { font-size: 0.74rem; color: var(--muted); line-height: 1.25; }
.seg button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.slider { display: grid; gap: 2px; }
.slider label { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; }
.slider output { font-weight: 700; font-variant-numeric: tabular-nums; font-family: var(--font-display); }
.slider input[type="range"] { width: 100%; accent-color: var(--accent); }
.slider .hint { font-size: 0.78rem; color: var(--muted); }
.dimset { display: grid; gap: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.dimset h4 { margin: 0; font-family: var(--font-display); font-size: 1.02rem; }
.dimset > .hint { font-size: 0.78rem; color: var(--muted); margin-top: -8px; }
.lvl-comfort input[type="range"] { accent-color: var(--z-green); }
/* Auf hellem Grund dunklere Töne, sonst zeichnet Chrome die Reglerschiene schwarz */
.lvl-progress input[type="range"] { accent-color: var(--z-yellow-strong); }
.lvl-challenge input[type="range"] { accent-color: var(--z-orange-strong); }
.req { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
.req input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
.summary { font-weight: 600; }
.btn {
  display: inline-block;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--fg);
  border-radius: 8px;
  padding: 8px 14px;
  justify-self: start;
  text-decoration: none;
  font-weight: 600;
  text-align: center;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
details.more { display: block; }
details.more summary { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; cursor: pointer; }
.more-body { display: grid; gap: 10px; margin-top: 10px; }
.more-body h4 { margin: 6px 0 0; font-family: var(--font-display); font-size: 1.02rem; }

.legend { display: flex; flex-wrap: wrap; gap: 6px; }

/* Tagesmodus und Coach */
.modebar { display: grid; gap: 8px; }
.modebar h3 {
  margin: 0;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  font-weight: 600;
}
.modebar p { margin: 0; }
.coach {
  margin: 0;
  display: grid;
  gap: 10px;
  background: var(--accent-soft);
  border-radius: var(--radius);
  padding: 10px 12px;
  font-size: 0.92rem;
}
.coach p { margin: 0; }
.coach.ok { background: var(--ok-soft); }

/* Zonen-Skala 0 bis 5 */
.zwrap { display: grid; gap: 2px; }
.zscale { position: relative; height: 12px; border-radius: 6px; overflow: hidden; background: var(--bar-track); }
.zscale > span { position: absolute; top: 0; bottom: 0; background-color: var(--zc); background-image: var(--zpat, none); }
.zscale > span + span { border-left: 2px solid var(--surface); }
.zticks { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.zlist { display: grid; gap: 12px; }
.zrow { display: grid; gap: 4px; }
.zrow-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 10px; }
.zrow-head span { font-size: 0.8rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Character anlegen */
.wizard-head { display: grid; gap: 4px; }
.wizard-head h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 1.45rem; line-height: 1.1; }
.wizard-head p { margin: 0; }
.stepbar { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 4px; }
.stepbar i { height: 4px; border-radius: 2px; background: var(--bar-track); }
.stepbar i.on { background: var(--accent); }
.wizard { display: grid; gap: 14px; }
.wizard h3 { margin: 0; font-family: var(--font-display); font-size: 1.15rem; font-weight: 700; text-wrap: balance; }
.wizard p { margin: 0; }
.wizard .lead { font-size: 0.98rem; }
.q { display: grid; gap: 8px; border-radius: var(--radius); scroll-margin: 90px 0 90px; }
.q.missing { outline: 2px solid var(--warn); outline-offset: 3px; }
.choices { display: grid; gap: 8px; }
.choice {
  display: grid;
  gap: 2px;
  text-align: left;
  border: 1px solid var(--line);
  background: var(--surface);
  border-radius: var(--radius);
  padding: 10px 12px;
}
.choice b { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; }
.choice span { font-size: 0.85rem; color: var(--muted); line-height: 1.35; }
.choice[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.rate { background: var(--surface); border: 1px solid var(--line); padding: 10px 12px; }
.rate p { font-size: 0.95rem; }
.rate-btns { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.rate-btns button {
  min-height: 42px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  border-radius: 8px;
  font-family: var(--font-display);
  font-weight: 600;
